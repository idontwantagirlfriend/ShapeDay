# Signed Windows builds, on tag push. On windows-latest there is a real
# signtool, so signing runs natively when the CSC_LINK / CSC_KEY_PASSWORD
# repo secrets exist; without them the build is unsigned (see README:
# Signing). Artifacts attach to the matching GitHub release.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build (signs when secrets are present)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder --win nsis portable --publish never # artifacts attach via the release step below
      - name: Attach artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ShapeDay-Setup-*.exe
            dist/ShapeDay-Portable-*.exe

# Tag releases reuse CI so installers are published only after all checks pass.
# Signing is optional; configure the repository secrets to sign and notarize.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    with:
      sign: true
    secrets: inherit

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: shapeday-*
          merge-multiple: true
          path: dist
      - name: Attach artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/ShapeDay-Setup-*.exe
            dist/ShapeDay-Portable-*.exe
            dist/ShapeDay-*.dmg
            dist/ShapeDay-*.zip
            dist/ShapeDay-*.AppImage

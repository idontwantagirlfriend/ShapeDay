<!DOCTYPE html>
<html lang="en" class="overlay">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>ShapeDay bar</title>
  <link rel="stylesheet" href="ui.css" />
</head>
<body>
  <!-- top style: full-width strip, click-through except the center grip -->
  <div class="topbar" id="topbar" hidden>
    <div class="strip-fill" id="strip-fill"></div>
    <span class="dot" id="top-dot"></span>
    <span class="headline" id="top-headline">no task on</span>
    <span class="time" id="top-time"></span>
    <span class="strip-grip" id="strip-grip" title="Drag">⋯</span>
  </div>

  <!-- floater style: the rounded capsule only — headline, clock, grip -->
  <div class="floater" id="floater" hidden>
    <span class="dot" id="fl-dot"></span>
    <span class="headline" id="fl-headline">no task on</span>
    <span class="clock" id="fl-clock"></span>
    <span class="fl-grip" id="fl-grip" title="Drag">⋯</span>
  </div>

  <script src="../core/timeutil.cjs"></script>
  <script src="bar.js"></script>
</body>
</html>
